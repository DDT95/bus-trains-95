name: Publier sur GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Actualiser le flux ferroviaire IDFM
        run: |
          curl --fail --silent --show-error --retry 1 --connect-timeout 10 --max-time 45 \
            "https://piece-jointe-carto.developpement-durable.gouv.fr/DEPT095A/CARTOGRAPHIE/CARTE_STATIQUE/2026/26_07_4873/idf_TR/prim_proxy.php" \
            --output public/live.json \
          || curl --fail --silent --show-error --max-time 30 \
            "https://ddt95.github.io/bus-trains-95/live.json" \
            --output public/live.json
          node -e "JSON.parse(require('fs').readFileSync('public/live.json','utf8'))"
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
